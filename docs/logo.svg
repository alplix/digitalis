<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12281a"/>
      <stop offset="1" stop-color="#04140b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9f99d"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#bg)"/>
  <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#glow)"/>

  <!-- stem -->
  <path d="M100 182 C100 156 102 126 100 94"
        stroke="#34d399" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- upper floret -->
  <g transform="translate(100 80)">
    <path d="M0 -17 C-12 -13 -16 -3 -16 6 C-16 15 -9 21 -2 23 C5 21 12 15 12 6 C12 -3 8 -13 0 -17 Z"
          fill="url(#b1)"/>
    <circle cx="-5" cy="-2" r="1.5" fill="#052e16" opacity="0.45"/>
    <circle cx="1" cy="-3" r="1.5" fill="#052e16" opacity="0.45"/>
    <circle cx="6" cy="0" r="1.5" fill="#052e16" opacity="0.45"/>
  </g>

  <!-- middle floret -->
  <g transform="translate(100 112)">
    <path d="M0 -20 C-14 -15 -19 -4 -19 7 C-19 17 -11 24 -3 27 C5 24 13 17 13 7 C13 -4 9 -15 0 -20 Z"
          fill="url(#b2)"/>
    <circle cx="-6" cy="-3" r="1.7" fill="#052e16" opacity="0.45"/>
    <circle cx="1" cy="-4" r="1.7" fill="#052e16" opacity="0.45"/>
    <circle cx="7" cy="0" r="1.7" fill="#052e16" opacity="0.45"/>
    <path d="M0 -6 C-5 -1 -5 9 0 13 C5 9 5 -1 0 -6 Z" fill="#052e16" opacity="0.35"/>
  </g>

  <!-- lower floret -->
  <g transform="translate(100 148)">
    <path d="M0 -18 C-13 -14 -17 -3 -17 7 C-17 16 -10 22 -3 24 C4 22 10 16 10 7 C10 -3 7 -14 0 -18 Z"
          fill="url(#b3)"/>
    <circle cx="-5" cy="-2" r="1.5" fill="#052e16" opacity="0.4"/>
    <circle cx="1" cy="-3" r="1.5" fill="#052e16" opacity="0.4"/>
    <circle cx="6" cy="0" r="1.5" fill="#052e16" opacity="0.4"/>
    <path d="M0 -5 C-4 -1 -4 8 0 11 C4 8 4 -1 0 -5 Z" fill="#052e16" opacity="0.3"/>
  </g>

  <!-- leaves -->
  <path d="M100 180 C94 166 97 150 103 150 C102 160 101 172 100 180 Z" fill="#166534" opacity="0.9"/>
  <path d="M100 186 C102 172 98 158 93 160 C95 169 97 178 100 186 Z" fill="#15803d" opacity="0.85"/>

  <!-- text -->
  <text x="100" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="27"
        font-weight="bold" fill="#e7f3eb">Digitalis</text>
  <ellipse cx="100" cy="58" rx="66" ry="1.4" fill="#a3e635" opacity="0.35"/>
  <text x="100" y="203" text-anchor="middle" font-family="Georgia, serif" font-size="13"
        fill="#93b5a2">Yüksük Otu · Foxglove</text>
</svg>