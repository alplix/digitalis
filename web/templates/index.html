let lang = (localStorage.getItem('dg-lang') || 'en');
let translations = I18N[lang] || I18N.en;
let cats = [];
let openT = {};
let targetCat = '';

function t(key) { return translations[key] !== undefined ? translations[key] : (I18N.en[key] || key); }
function applyLang() {
  translations = I18N[lang] || I18N.en;
  document.documentElement.lang = lang;
  document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
  const sel = document.getElementById('langSelect');
  if (sel && sel.value !== lang) sel.value = lang;
  refreshCats();
}
function setLang(l) { lang = l; localStorage.setItem('dg-lang', l); applyLang(); refresh(); }

// ---------- formatting ----------
function fmtBytes(b) {
  if (!b) return '0 B';
  const units = ['B','KB','MB','GB','TB'];
  let i = 0, v = b;
  while (v >= 1024 && i < units.length-1) { v /= 1024; i++; }
  return v.toFixed(v >= 10 || i === 0 ? 0 : 1) + ' ' + units[i];
}
function fmtSpeed(bps) { if (!bps) return '—'; return fmtBytes(bps) + '/s'; }
function fmtRatio(r) {
  if (!r || r < 0.001) return '—';
  return r >= 10 ? r.toFixed(1) : r.toFixed(3);
}
function fmtTime(iso) {
  if (!iso) return t('never');
  const then = new Date(iso), now = Date.now();
  const diff = Math.max(0, Math.floor((now - then.getTime())/1000));
  if (diff < 5) return 'now';
  if (diff < 60) return diff + 's';
  if (diff < 3600) return Math.floor(diff/60) + 'm';
  if (diff < 86400) return Math.floor(diff/3600) + 'h';
  return Math.floor(diff/86400) + 'd';
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---------- state badges ----------
function stateBadge(state) {
  const map = {
    'seeding':     ['bg-emerald-500/20 text-emerald-200 border-emerald-400/40', t('seeding')],
    'downloading': ['bg-sky-500/20 text-sky-200 border-sky-400/40', t('downloading')],
    'paused':      ['bg-amber-500/20 text-amber-200 border-amber-400/40', t('paused')],
    'queued':      ['bg-fuchsia-500/20 text-fuchsia-200 border-fuchsia-400/40', t('queued')],
    'stopped':     ['bg-rose-500/20 text-rose-200 border-rose-400/40', t('stopped')],
    'error':       ['bg-rose-500/20 text-rose-200 border-rose-400/40', t('error')]
  };
  const [cls, label] = map[state] || ['bg-dg-700 text-dg-200 border-dg-500/40', state];
  return `<span class="px-2.5 py-0.5 rounded-full text-xs font-medium border ${cls}">${label}</span>`;
}

function colorGrad(tr) {
  if (tr.state === 'seeding') return 'from-emerald-400 via-teal-300 to-sky-400';
  return 'from-dg-400 via-fuchsia-400 to-sky-400';
}

function progressBar(tr) {
  const pct = Math.round((tr.progress||0)*100);
  return `
    <div class="flex items-center gap-3">
      <div class="flex-1 h-2.5 rounded-full bg-dg-950/70 overflow-hidden">
        <div class="h-full rounded-full bg-gradient-to-r ${colorGrad(tr)} transition-all duration-700" style="width:${pct}%"></div>
      </div>
      <span class="text-xs font-mono text-dg-200 w-12 text-right">${pct}%</span>
    </div>`;
}

function trackerTable(trs) {
  if (!trs || !trs.length) return `<span class="text-dg-500">—</span>`;
  return trs.map(tr => `
    <div class="flex items-center justify-between gap-3 py-1 border-b border-dg-800/40 text-xs">
      <span class="truncate text-dg-200 max-w-[40%] break-all">${esc(tr.url)}</span>
      <span class="${tr.working ? 'text-emerald-300' : 'text-rose-300'} shrink-0">${tr.working ? '● ' + t('working') : '○ ' + t('down')}</span>
      <span class="shrink-0 text-dg-300">${t('seeders')} ${tr.last_seeders} / ${t('leechers')} ${tr.last_leechers}</span>
      <span class="shrink-0 text-dg-300">${t('announce')} ${tr.announces} (${tr.successes}${t('ok')}/${tr.failures}${t('fail')})</span>
      <span class="shrink-0 text-dg-400">${t('lastSuccess')}: ${fmtTime(tr.last_success)}</span>
    </div>`).join('');
}

function moveOptions(tr) {
  return `<option value="">${esc(t('root'))}</option>` +
    cats.map(c => `<option value="${esc(c.path)}" ${tr.category === c.path ? 'selected' : ''}>${'\u00A0'.repeat(c.depth*4)}${esc(c.path)}</option>`).join('');
}

  <div class="card rounded-2xl overflow-hidden">
    <div class="p-4 md:p-5 flex flex-col gap-3">
      <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-3">

          <div class="flex items-start gap-2 flex-wrap">
            <h3 class="font-semibold text-dg-100 truncate">${esc(tr.name)}</h3>
            ${stateBadge(tr.state)}
            <span class="px-2 py-0.5 rounded-full bg-dg-800/70 border border-dg-500/30 text-dg-300 text-xs">${catLabel}</span>
          </div>
          <p class="text-xs text-dg-500 font-mono truncate mt-0.5">${tr.info_hash}</p>
          <div class="mt-3">${progressBar(tr)}</div>
          <div class="flex flex-wrap gap-x-5 gap-y-1 mt-3 text-xs text-dg-200">
            <span>↓ <span class="text-sky-300 font-mono">${fmtSpeed(tr.download_speed)}</span></span>
            <span>↑ <span class="text-pink-300 font-mono">${fmtSpeed(tr.upload_speed)}</span></span>
            <span>${fmtBytes(tr.downloaded)} / ${fmtBytes(tr.size)}</span>
            <span>↑ <span class="text-pink-300 font-mono">${fmtBytes(tr.uploaded)}</span></span>
            <span>Peer: <span class="text-dg-100 font-mono">${tr.peers_connected}</span></span>
            <span>Seed/Leech: <span class="text-dg-100 font-mono">${tr.seeders}/${tr.leechers}</span></span>
            <span>Piece: <span class="text-dg-100 font-mono">${have}</span></span>
          </div>
          <div class="flex flex-wrap gap-2 mt-3 text-xs">
            <span class="px-2 py-0.5 rounded-full bg-fuchsia-500/15 border border-fuchsia-400/30 text-fuchsia-200">${t('ratio')}: <b class="font-mono">${fmtRatio(tr.ratio)}</b></span>
            <span class="px-2 py-0.5 rounded-full bg-pink-500/15 border border-pink-400/30 text-pink-200">${t('seededTo')}: <b class="font-mono">${tr.seeded_to}</b> ${t('peers')}</span>
            <span class="px-2 py-0.5 rounded-full bg-emerald-500/15 border border-emerald-400/30 text-emerald-200">${t('trackers')}: <b class="font-mono">${trs.filter(x=>x.working).length}</b> ${t('working')} / ${trs.filter(x=>!x.working).length} ${t('down')}</span>
          </div>
        </div>
        <div class="flex gap-2 md:flex-col xl:flex-row md:items-end shrink-0">
          ${tr.state === 'paused'
            ? `<button onclick="act('${tr.id}','resume')" class="px-3 py-1.5 rounded-lg bg-emerald-500/30 border border-emerald-400/40 text-emerald-100 text-xs hover:bg-emerald-500/50 transition">${t('resuming')}</button>`
            : `<button onclick="act('${tr.id}','pause')" class="px-3 py-1.5 rounded-lg dg-input text-dg-100 text-xs hover:border-dg-300 transition">${t('pausing')}</button>`}
          <button onclick="act('${tr.id}','delete')" class="px-3 py-1.5 rounded-lg bg-rose-500/30 border border-rose-400/40 text-rose-100 text-xs hover:bg-rose-500/50 transition">${t('deleting')}</button>
        </div>
      </div>
      ${open ? `<div class="acc-open mt-3 pt-3 border-t border-dg-700/50 space-y-3">
        <div>
          <div class="text-xs uppercase tracking-widest stat-label mb-2">${t('trackers')}</div>

        </div>

            ${moveOptions(tr)}

          <button onclick="moveTorrent('${tr.id}')" class="px-3 py-1.5 rounded-lg grad-btn text-white text-xs font-medium transition">${t('move')}</button>
        </div>
      </div>` : ''}
    </div>
  </div>`;
}

async function api(path, opts) {
  const r = await fetch(API + path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
  return data;
}

// ---------- refresh ----------
async function refresh() {
  try {
    const list = await api('/torrents');
    const el = document.getElementById('torrentList');
    if (!list.length) {
      el.innerHTML = `<div class="card rounded-2xl p-8 text-center text-dg-400 text-sm">${esc(t('noTorrents'))}</div>`;
    } else {
      el.innerHTML = list.map(x => renderTorrent(x, !!openT[x.id])).join('');
    }
    document.getElementById('statTotal').textContent = list.length;
    document.getElementById('statSeeding').textContent = list.filter(x=>x.state==='seeding').length;
    document.getElementById('statDownloading').textContent = list.filter(x=>x.state==='downloading').length;
    let up = 0, served = 0;
    list.forEach(x => { up += x.uploaded || 0; served += x.seeded_to || 0; });
    document.getElementById('statUploaded').textContent = fmtBytes(up);
    document.getElementById('statServed').textContent = served;
  } catch (e) {
    document.getElementById('torrentList').innerHTML =
      `<div class="card rounded-2xl p-6 text-center text-rose-300 text-sm">${esc(t('connError'))} ${esc(e.message)}</div>`;
  }
}

      <span class="text-xs px-2 py-0.5 rounded-full bg-dg-800/70 text-dg-300">${c.torrents}</span>
      <span class="flex-1"></span>
      <button onclick="event.stopPropagation();setTarget('${esc(c.path)}')" title="${esc(t('targetSet'))}" class="text-xs text-fuchsia-300 hover:text-fuchsia-200 px-1.5">◎</button>
      <button onclick="event.stopPropagation();delCategory('${esc(c.path)}')" title="${esc(t('deleteFolder'))}" class="text-xs text-rose-300 hover:text-rose-200 px-1.5">✕</button>
    </div>`).join('');
}

function setTarget(path) {
  targetCat = path;
  document.getElementById('dirInput').value = path;
  refreshCats();
  const st = document.getElementById('addStatus');
  st.innerHTML = `<span class="text-fuchsia-300">${esc(t('targetSet'))}: 📁 ${esc(path || t('root'))}</span>`;
}

async function newCategory() {
  const p = prompt(t('newFolder') + ' — unix/linux/debian');
  if (!p) return;
  try {
    await api('/categories', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path: p}) });
    await refreshCats();
    const st = document.getElementById('addStatus');
    st.innerHTML = `<span class="text-emerald-300">${esc(t('catCreated'))}: ${esc(p)}</span>`;
  } catch (e) { alert(e.message); }
}

async function delCategory(path) {
  if (!confirm(`${t('deleteFolder')}: ${path}?`)) return;
  try {
    await api('/categories', { method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path}) });
    if (targetCat === path) { targetCat = ''; document.getElementById('dirInput').value = ''; }
    await refreshCats();
  } catch (e) { alert(e.message || t('catEmpty')); }
}

// ---------- add ----------
async function addFromInput() {
  const ta = document.getElementById('sourceInput');
  const lines = ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
  if (!lines.length) return;
  const status = document.getElementById('addStatus');
  const dir = document.getElementById('dirInput').value.trim();
  let ok = 0, fail = 0, lastFail = '';
  for (const line of lines) {
    try {
      await api('/torrents', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({source: line, dir}) });
      ok++;
    } catch (e) { fail++; lastFail = `${esc(line.slice(0,60))}: ${esc(e.message)}`; }
  }
  ta.value = '';
  status.innerHTML = `<span class="text-emerald-300">${ok} ${esc(t('adding'))}${fail ? `, ${fail} ${esc(t('errors'))} — ${lastFail}` : ''}</span>`;
  await refreshCats();
  refresh();
}

async function addFromFile(input) {
  const file = input.files[0];
  if (!file) return;
  const buf = new Uint8Array(await file.arrayBuffer());
  let bin = '';
  buf.forEach(b => bin += String.fromCharCode(b));
  const b64 = btoa(bin);
  const status = document.getElementById('addStatus');
  const dir = document.getElementById('dirInput').value.trim();
  try {
    await api('/torrents', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({source: b64, dir}) });
    status.innerHTML = `<span class="text-emerald-300">${esc(t('added'))}</span>`;
  } catch (e) {
    status.innerHTML = `<span class="text-rose-300">${esc(t('connError'))} ${esc(e.message)}</span>`;
  }
  input.value = '';
  await refreshCats();
  refresh();
}

async function moveTorrent(id) {
  const sel = document.getElementById('mv-' + id);
  if (!sel) return;
  const dir = sel.value;
  try {
    await api(`/torrents/${id}/move`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({category: dir}) });
    const st = document.getElementById('addStatus');
    st.innerHTML = `<span class="text-emerald-300">${esc(t('moved'))}: 📁 ${esc(dir || t('root'))}</span>`;
    await refreshCats();
    refresh();
  } catch (e) { alert(e.message); }
}

function toggleDet(id) { openT[id] = !openT[id]; refresh(); }

async function act(id, action) {
  try {
    await api(`/torrents/${id}/${action}`, { method:'POST' });
    refresh();
  } catch (e) { alert(e.message); }
}

setInterval(refresh, 2500);
applyLang();
refresh();
</script>
</body>
</html>
